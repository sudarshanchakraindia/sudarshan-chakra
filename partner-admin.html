<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage City Channel Partners — Admin</title>
<style>
  :root{ --saffron:#FF6B00; --gold:#F5A623; --deep:#1A1206; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Segoe UI',sans-serif; background:#FFF8F0; color:var(--deep); }
  header{ background:linear-gradient(135deg,#1A0A00,#3D1A00); color:#fff; padding:16px 20px; }
  .wrap{ padding:20px; max-width:900px; margin:0 auto; }
  #gate{ max-width:340px; margin:80px auto; text-align:center; }
  #gate input{ width:100%; padding:12px; font-size:15px; border:1px solid #ddd; border-radius:8px; margin:12px 0; }
  #gate button{ width:100%; padding:12px; font-size:15px; font-weight:700; color:#fff; background:var(--saffron); border:none; border-radius:8px; cursor:pointer; }
  #gate p.err{ color:#c0392b; font-size:13px; }
  #app{ display:none; }
  .card{ background:#fff; border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .card h2{ font-size:15px; margin:0 0 12px; }
  label{ display:block; font-size:12px; font-weight:700; color:#7C4A1E; margin-bottom:4px; margin-top:10px; }
  input, select{ width:100%; padding:9px; border:1px solid #ddd; border-radius:8px; font-size:14px; }
  .btn{ margin-top:14px; padding:10px 18px; border-radius:8px; border:none; font-weight:700; color:#fff; background:var(--saffron); cursor:pointer; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ text-align:left; padding:8px 10px; border-bottom:1px solid #f0e4d4; }
  th{ background:#FFF3E0; }
  .row-actions button{ font-size:11px; padding:4px 8px; border-radius:6px; border:none; cursor:pointer; margin-right:4px; }
  .link-btn{ background:#e0e0e0; }
  .payout-btn{ background:#dcf7dc; }
</style>
</head>
<body>

  <div id="gate">
    <h1>🔱 Admin Login</h1>
    <p style="color:#7C4A1E; font-size:13px;">Same password as your main admin dashboard</p>
    <input type="password" id="pw" placeholder="Admin password">
    <button onclick="tryLogin()">Manage Partners</button>
    <p class="err" id="err"></p>
  </div>

  <div id="app">
    <header><h1 style="margin:0; font-size:18px;">🔱 City Channel Partners</h1></header>
    <div class="wrap">

      <div class="card">
        <h2>➕ Add New Partner</h2>
        <label>Name</label>
        <input id="newName" placeholder="Partner's full name">
        <label>City</label>
        <input id="newCity" placeholder="e.g. Jodhpur">
        <label>Pincode (their city/area — used to auto-credit registrations even without their link)</label>
        <input id="newPincode" placeholder="e.g. 342001" maxlength="6">
        <label>Referral Code (unique, becomes their login + link)</label>
        <input id="newCode" placeholder="e.g. JODHPUR01" style="text-transform:uppercase;">
        <button class="btn" onclick="addPartner()">Add Partner</button>
        <p id="addErr" style="color:#c0392b; font-size:13px; margin-top:8px;"></p>
      </div>

      <div class="card">
        <h2>👥 All Partners</h2>
        <table>
          <thead><tr><th>Name</th><th>City</th><th>Pincode</th><th>Code</th><th>Status</th><th>Providers</th><th></th></tr></thead>
          <tbody id="partnerBody"><tr><td colspan="7">Loading…</td></tr></tbody>
        </table>
      </div>

      <div class="card" id="payoutCard" style="display:none;">
        <h2>💰 Log Payout — <span id="payoutForName"></span></h2>
        <label>Amount (₹)</label>
        <input id="payoutAmount" type="number">
        <label>Note</label>
        <input id="payoutNote" placeholder="e.g. September convenience fee share">
        <button class="btn" onclick="submitPayout()">Log Payout</button>
      </div>

    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, set, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDr0jgOBiQ59F8CFZK0dnqgkG3ljjJu3P4",
    authDomain: "sudarshan-chakra-b0ac1.firebaseapp.com",
    databaseURL: "https://sudarshan-chakra-b0ac1-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "sudarshan-chakra-b0ac1",
    storageBucket: "sudarshan-chakra-b0ac1.firebasestorage.app",
    messagingSenderId: "357210144411",
    appId: "1:357210144411:web:b440a94cf78b04b58b103e"
  };
  const app  = initializeApp(firebaseConfig);
  const db   = getDatabase(app);
  const auth = getAuth(app);

  const ADMIN_PASSWORD_KEY = 'sc_admin_password';
  const ADMIN_EMAIL = 'sudarshanchakraindia@gmail.com';
  const ADMIN_FIREBASE_PASSWORD = 'MyActualPassword144@Crore';

  window.tryLogin = async function(){
    const entered  = document.getElementById('pw').value;
    const expected = localStorage.getItem(ADMIN_PASSWORD_KEY) || 'admin123';
    if (entered !== expected){
      document.getElementById('err').textContent = 'Incorrect password.';
      return;
    }
    try {
      await signInWithEmailAndPassword(auth, ADMIN_EMAIL, ADMIN_FIREBASE_PASSWORD);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display  = 'block';
      loadPartners();
    } catch (e) {
      document.getElementById('err').textContent = 'Firebase sign-in failed: ' + e.message;
    }
  };

  window.addPartner = async function(){
    const name = document.getElementById('newName').value.trim();
    const city = document.getElementById('newCity').value.trim();
    const pincode = document.getElementById('newPincode').value.trim();
    const code = document.getElementById('newCode').value.trim().toUpperCase();
    const errEl = document.getElementById('addErr');
    errEl.style.color = '#c0392b';
    errEl.textContent = '';
    if (!name || !city || !pincode || !code) { errEl.textContent = 'All fields are required.'; return; }

    try {
      const existing = await get(ref(db, 'partners/' + code));
      if (existing.exists()) { errEl.textContent = 'That code is already in use — pick a different one.'; return; }

      const existingPincode = await get(ref(db, 'partnerPincodes/' + pincode));
      if (existingPincode.exists() && existingPincode.val() !== code) {
        errEl.textContent = 'That pincode is already assigned to partner ' + existingPincode.val() + '.';
        return;
      }

      await set(ref(db, 'partners/' + code), {
        name, city, pincode, status: 'active',
        appointedDate: new Date().toISOString()
      });
      await set(ref(db, 'partnerPincodes/' + pincode), code);

      document.getElementById('newName').value = '';
      document.getElementById('newCity').value = '';
      document.getElementById('newPincode').value = '';
      document.getElementById('newCode').value = '';
      errEl.style.color = '#1e7d1e';
      errEl.textContent = '✅ Partner added successfully.';
      loadPartners();
    } catch (e) {
      errEl.textContent = '❌ Save failed: ' + e.code + ' — ' + e.message;
      console.error('addPartner error:', e);
    }
  };

  window.copyPartnerLink = function(code){
    const link = location.origin + location.pathname.replace('partner-admin.html', 'partner-dashboard.html') + '?code=' + code;
    navigator.clipboard.writeText(link).then(() => alert('✅ Dashboard link copied:\n' + link));
  };

  let payoutTargetCode = null;
  window.openPayout = function(code, name){
    payoutTargetCode = code;
    document.getElementById('payoutForName').textContent = name + ' (' + code + ')';
    document.getElementById('payoutCard').style.display = 'block';
    document.getElementById('payoutCard').scrollIntoView({ behavior:'smooth' });
  };

  window.submitPayout = async function(){
    if (!payoutTargetCode) return;
    const amount = Number(document.getElementById('payoutAmount').value);
    const note   = document.getElementById('payoutNote').value.trim();
    if (!amount) { alert('Enter an amount.'); return; }
    try {
      await push(ref(db, 'partnerPayouts/' + payoutTargetCode), {
        amount, note, date: new Date().toISOString()
      });
      document.getElementById('payoutAmount').value = '';
      document.getElementById('payoutNote').value = '';
      document.getElementById('payoutCard').style.display = 'none';
      alert('✅ Payout logged.');
    } catch (e) {
      alert('❌ Save failed: ' + e.code + ' — ' + e.message);
      console.error('submitPayout error:', e);
    }
  };

  async function loadPartners(){
    try {
      const [partnersSnap, providersSnap] = await Promise.all([
        get(ref(db, 'partners')),
        get(ref(db, 'providers'))
      ]);
      const partners = partnersSnap.exists() ? partnersSnap.val() : {};
      const allProviders = providersSnap.exists() ? Object.values(providersSnap.val()) : [];

      const body = document.getElementById('partnerBody');
      const codes = Object.keys(partners);
      if (codes.length === 0) {
        body.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:16px;">No partners added yet</td></tr>';
        return;
      }
      body.innerHTML = codes.map(code => {
        const p = partners[code];
        const count = allProviders.filter(pr => pr.referredByPartner === code).length;
        return `
          <tr>
            <td>${p.name || '—'}</td>
            <td>${p.city || '—'}</td>
            <td>${p.pincode || '—'}</td>
            <td>${code}</td>
            <td>${p.status || 'active'}</td>
            <td>${count}</td>
            <td class="row-actions">
              <button class="link-btn" onclick="copyPartnerLink('${code}')">Copy Link</button>
              <button class="payout-btn" onclick="openPayout('${code}','${(p.name||'').replace(/'/g,"")}')">Log Payout</button>
            </td>
          </tr>
        `;
      }).join('');
    } catch (e) {
      document.getElementById('partnerBody').innerHTML =
        `<tr><td colspan="7" style="text-align:center; padding:16px; color:#c0392b;">❌ Load failed: ${e.code} — ${e.message}</td></tr>`;
      console.error('loadPartners error:', e);
    }
  }

  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
</script>
</body>
</html>
