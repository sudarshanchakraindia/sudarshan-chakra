<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Training Videos — Admin</title>
<style>
  :root{ --saffron:#FF6B00; --gold:#F5A623; --deep:#1A1206; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Segoe UI',sans-serif; background:#FFF8F0; color:var(--deep); }
  header{ background:linear-gradient(135deg,#1A0A00,#3D1A00); color:#fff; padding:16px 20px; }
  .wrap{ padding:20px; max-width:900px; margin:0 auto; }
  #gate{ max-width:340px; margin:80px auto; text-align:center; }
  #gate input{ width:100%; padding:12px; font-size:15px; border:1px solid #ddd; border-radius:8px; margin:12px 0; }
  #gate button{ width:100%; padding:12px; font-size:15px; font-weight:700; color:#fff; background:var(--saffron); border:none; border-radius:8px; cursor:pointer; }
  #gate p.err{ color:#c0392b; font-size:13px; }
  #app{ display:none; }
  .card{ background:#fff; border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .card h2{ font-size:15px; margin:0 0 12px; }
  label{ display:block; font-size:12px; font-weight:700; color:#7C4A1E; margin-bottom:4px; margin-top:10px; }
  input, select{ width:100%; padding:9px; border:1px solid #ddd; border-radius:8px; font-size:14px; }
  .btn{ margin-top:14px; padding:10px 18px; border-radius:8px; border:none; font-weight:700; color:#fff; background:var(--saffron); cursor:pointer; }
  .tabs{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tab{ padding:8px 16px; border-radius:20px; background:#f0e4d4; font-size:13px; font-weight:700; cursor:pointer; border:none; }
  .tab.active{ background:var(--saffron); color:#fff; }
  .video-row{ display:flex; justify-content:space-between; align-items:center; padding:12px; border-radius:10px; background:#FFF3E0; margin-bottom:8px; }
  .video-row .info{ font-size:13px; }
  .video-row .info b{ display:block; margin-bottom:2px; }
  .video-row .info span{ color:#7C4A1E; font-size:11px; }
  .video-row button{ font-size:11px; padding:5px 10px; border-radius:6px; border:none; cursor:pointer; background:#f5c6c6; }
  .empty{ text-align:center; color:#7C4A1E; font-size:13px; padding:20px; }
</style>
</head>
<body>

  <div id="gate">
    <h1>🔱 Admin Login</h1>
    <p style="color:#7C4A1E; font-size:13px;">Same password as your main admin dashboard</p>
    <input type="password" id="pw" placeholder="Admin password">
    <button onclick="tryLogin()">Manage Training Videos</button>
    <p class="err" id="err"></p>
  </div>

  <div id="app">
    <header><h1 style="margin:0; font-size:18px;">🔱 Training Video Manager</h1></header>
    <div class="wrap">

      <div class="card">
        <h2>➕ Add Training Video</h2>
        <label>Audience</label>
        <select id="newAudience">
          <option value="provider">Providers</option>
          <option value="seeker">Seekers</option>
          <option value="partner">Channel Partners</option>
        </select>
        <label>Title</label>
        <input id="newTitle" placeholder="e.g. How to complete your provider profile">
        <label>Loom Link (paste the normal share link — it's converted automatically)</label>
        <input id="newLoomUrl" placeholder="https://www.loom.com/share/xxxxxxxx">
        <label>Order (lower numbers show first)</label>
        <input id="newOrder" type="number" value="1">
        <button class="btn" onclick="addVideo()">Add Video</button>
        <p id="addErr" style="color:#c0392b; font-size:13px; margin-top:8px;"></p>
      </div>

      <div class="card">
        <h2>📚 All Training Videos</h2>
        <div class="tabs">
          <button class="tab active" data-aud="provider" onclick="switchTab(this)">Providers</button>
          <button class="tab" data-aud="seeker" onclick="switchTab(this)">Seekers</button>
          <button class="tab" data-aud="partner" onclick="switchTab(this)">Channel Partners</button>
        </div>
        <div id="videoList"></div>
      </div>

    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, set, push, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDr0jgOBiQ59F8CFZK0dnqgkG3ljjJu3P4",
    authDomain: "sudarshan-chakra-b0ac1.firebaseapp.com",
    databaseURL: "https://sudarshan-chakra-b0ac1-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "sudarshan-chakra-b0ac1",
    storageBucket: "sudarshan-chakra-b0ac1.firebasestorage.app",
    messagingSenderId: "357210144411",
    appId: "1:357210144411:web:b440a94cf78b04b58b103e"
  };
  const app  = initializeApp(firebaseConfig);
  const db   = getDatabase(app);
  const auth = getAuth(app);

  const ADMIN_PASSWORD_KEY = 'sc_admin_password';
  const ADMIN_EMAIL = 'sudarshanchakraindia@gmail.com';
  const ADMIN_FIREBASE_PASSWORD = 'MyActualPassword144@Crore';

  // Accepts a normal Loom share link (loom.com/share/ID) or an already-embed
  // link (loom.com/embed/ID) and always returns the embeddable form.
  function loomIdFromUrl(url){
    const m = (url || '').match(/loom\.com\/(?:share|embed)\/([a-zA-Z0-9]+)/i);
    return m ? m[1] : null;
  }

  window.tryLogin = async function(){
    const entered  = document.getElementById('pw').value;
    const expected = localStorage.getItem(ADMIN_PASSWORD_KEY) || 'admin123';
    if (entered !== expected){
      document.getElementById('err').textContent = 'Incorrect password.';
      return;
    }
    try {
      await signInWithEmailAndPassword(auth, ADMIN_EMAIL, ADMIN_FIREBASE_PASSWORD);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display  = 'block';
      loadVideos('provider');
    } catch (e) {
      document.getElementById('err').textContent = 'Firebase sign-in failed: ' + e.message;
    }
  };

  window.addVideo = async function(){
    const audience = document.getElementById('newAudience').value;
    const title = document.getElementById('newTitle').value.trim();
    const loomUrl = document.getElementById('newLoomUrl').value.trim();
    const order = Number(document.getElementById('newOrder').value) || 1;
    const errEl = document.getElementById('addErr');
    errEl.style.color = '#c0392b';
    errEl.textContent = '';

    if (!title || !loomUrl) { errEl.textContent = 'Title and Loom link are required.'; return; }
    const loomId = loomIdFromUrl(loomUrl);
    if (!loomId) { errEl.textContent = "That doesn't look like a Loom link. Expected something like https://www.loom.com/share/xxxxxxxx"; return; }

    try {
      await push(ref(db, 'trainingVideos'), {
        audience, title, loomId, order,
        addedAt: new Date().toISOString()
      });
      document.getElementById('newTitle').value = '';
      document.getElementById('newLoomUrl').value = '';
      document.getElementById('newOrder').value = '1';
      errEl.style.color = '#1e7d1e';
      errEl.textContent = '✅ Video added.';
      loadVideos(document.querySelector('.tab.active').dataset.aud);
    } catch (e) {
      errEl.textContent = '❌ Save failed: ' + e.code + ' — ' + e.message;
      console.error('addVideo error:', e);
    }
  };

  window.deleteVideo = async function(id){
    if (!confirm('Delete this training video?')) return;
    try {
      await remove(ref(db, 'trainingVideos/' + id));
      loadVideos(document.querySelector('.tab.active').dataset.aud);
    } catch (e) {
      alert('❌ Delete failed: ' + e.code + ' — ' + e.message);
    }
  };

  window.switchTab = function(el){
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    loadVideos(el.dataset.aud);
  };

  async function loadVideos(audience){
    const list = document.getElementById('videoList');
    list.innerHTML = 'Loading…';
    try {
      const snap = await get(ref(db, 'trainingVideos'));
      const all = snap.exists() ? snap.val() : {};
      const rows = Object.entries(all)
        .filter(([id, v]) => v.audience === audience)
        .sort((a,b) => (a[1].order||0) - (b[1].order||0));

      if (rows.length === 0) {
        list.innerHTML = '<div class="empty">No videos added for this audience yet</div>';
        return;
      }
      list.innerHTML = rows.map(([id, v]) => `
        <div class="video-row">
          <div class="info">
            <b>${v.title}</b>
            <span>Order: ${v.order || 1} · loom.com/share/${v.loomId}</span>
          </div>
          <button onclick="deleteVideo('${id}')">Delete</button>
        </div>
      `).join('');
    } catch (e) {
      list.innerHTML = `<div class="empty" style="color:#c0392b;">❌ Load failed: ${e.code} — ${e.message}</div>`;
    }
  }

  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
</script>
</body>
</html>
